name: Unpack project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip dec-ai.zip into the repo and commit
        run: |
          unzip -o dec-ai.zip
          rm dec-ai.zip
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add DEC AI project"
          git push
