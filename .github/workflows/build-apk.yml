name: Build DEC APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/v2-agent-loop-and-app-control
concurrency:
  group: dec-apk-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
  android-build:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Persist the debug signing key so APK updates keep the same certificate.
      # The first build creates it; subsequent builds restore the same key.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dec-android-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Validate APK integrity and signature before publishing
        working-directory: android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DEC AI build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
