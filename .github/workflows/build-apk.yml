name: Build DEC APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/v2-agent-loop-and-app-control
concurrency:
  group: dec-apk-build
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
  android-build:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Persist the debug signing key so APK updates keep the same certificate.
      # The first build creates it; subsequent builds restore the same key.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dec-android-debug-keystore-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Create stable debug signing key when missing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Explicitly sign APK with V1 and V2 schemes
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --out app/build/outputs/apk/debug/app-debug-v1v2.apk \
            "$APK"
          mv app/build/outputs/apk/debug/app-debug-v1v2.apk "$APK"
      - name: Validate APK integrity and signature before publishing
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"
      - name: Test installation on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.dec.ai
            adb shell dumpsys package com.dec.ai | grep -E 'versionName|versionCode|targetSdk'
      - name: Generate Android install compatibility diagnostics
        if: always()
        working-directory: android
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          REPORT=app/build/outputs/apk/debug/install-diagnostics.txt
          mkdir -p "$(dirname "$REPORT")"
          {
            echo "DEC AI APK INSTALL DIAGNOSTICS"
            echo "Build: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "=== File ==="
            ls -lh "$APK"
            sha256sum "$APK"
            file "$APK"
            echo
            echo "=== ZIP integrity ==="
            unzip -t "$APK"
            echo
            echo "=== Package metadata ==="
            AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
            "$AAPT" dump badging "$APK"
            echo
            echo "=== APK alignment ==="
            ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
            "$ZIPALIGN" -c -v 4 "$APK"
            echo
            echo "=== Native libraries / ABIs ==="
            unzip -Z1 "$APK" | grep -E '^lib/[^/]+/[^/]+[.]so$' | sort || true
            echo
            echo "=== Signature ==="
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          } 2>&1 | tee "$REPORT"
      - name: Upload APK and install diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dec-apk-install-diagnostics-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/install-diagnostics.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DEC AI build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
